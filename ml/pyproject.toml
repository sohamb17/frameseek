[project]
name = "frameseek"
version = "0.1.0"
description = "FrameSeek ML service and ingestion worker: multimodal video moment search"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frameseek*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs a running Postgres (FRAMESEEK_DATABASE_URL)",
  "models: downloads and runs pretrained models (slow)",
]
